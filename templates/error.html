<!-- templates/error.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {{ status_code }} — {{ title }}
  </title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at center,
          rgba(188, 255, 104, 0.08),
          transparent 35%
        ),
        #06070a;
      color: #f7f7f8;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .error-card {
      width: min(100%, 760px);
      padding: 70px 40px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 32px;
      background: rgba(255,255,255,.04);
      text-align: center;
    }

    .error-code {
      color: #bcff68;
      font-size: clamp(5rem, 16vw, 10rem);
      font-weight: 800;
      line-height: .9;
    }

    h1 {
      margin-top: 24px;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    p {
      max-width: 500px;
      margin: 20px auto 0;
      color: #9b9ca5;
      line-height: 1.7;
    }

    a {
      margin-top: 35px;
      display: inline-flex;
      padding: 15px 23px;
      border-radius: 999px;
      background: #bcff68;
      color: #071003;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="error-card">

    <div class="error-code">
      {{ status_code }}
    </div>

    <h1>
      {{ title }}
    </h1>

    <p>
      {{ description }}
    </p>

    <a href="{{ url_for('home') }}">
      Return home →
    </a>

  </main>

</body>
</html>
